name: stove_monitor
description: A Flutter app for stove detection with AI assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Existing dependencies
  camera: ^0.10.5+5
  path_provider: ^2.1.1
  http: ^1.1.0
  
  # NEW dependencies for voice assistant
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
